<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Devora Activity Center</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
  /* Layout: Coach Connect "Design Law" — paper ground, white slabs, 3px ink outlines, hard ink shadows.
     Black-and-white chrome; gradients only as small accents (active tab, tags, avatars, date blocks).
     Deliberately single (light) theme: every color is set explicitly. */
  :root {
    color-scheme: light;
    --ink: #0a0a0a;
    --paper: #f2f2f0;
    --white: #ffffff;
    --soft: #e3e3df;
    --muted: #575757;
    --brand: linear-gradient(135deg, #ff6b9d 0%, #fb923c 100%);
    --orchid: linear-gradient(135deg, #a78bfa 0%, #e879f9 100%);
    --sky: linear-gradient(135deg, #7dd3fc 0%, #a78bfa 100%);
    --blush: linear-gradient(135deg, #fda4af 0%, #fb7185 100%);
    --ramp: linear-gradient(90deg, #6206f1 0%, #9911e1 20%, #bf25b9 40%, #eb2d85 60%, #fa3467 80%, #ff6a1f 100%);
    --display: "Archivo Black", "Arial Black", Impact, sans-serif;
    --body: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "Space Mono", ui-monospace, Menlo, monospace;
    --r: 10px;
    --sh-sm: 2px 2px 0 0 var(--ink);
    --sh: 4px 4px 0 0 var(--ink);
    --sh-card: 5px 5px 0 0 var(--ink);
    --sh-lg: 7px 7px 0 0 var(--ink);
  }
  * { box-sizing: border-box; }
  body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--paper); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid #ff6b9d; outline-offset: 2px; }
  h1, h2, h3 { text-wrap: balance; }

  .wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  /* ── Top strip ── */
  .topbar { border-bottom: 3px solid var(--ink); background: var(--white); }
  .topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 20px; letter-spacing: -0.01em; }
  .brand-mark { width: 30px; height: 30px; border: 3px solid var(--ink); border-radius: 8px; background: var(--brand); box-shadow: var(--sh-sm); }
  .crumb { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .me { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }

  /* ── Hero ── */
  .hero .wrap { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 32px; align-items: end; padding-block: 40px 32px; }
  .eyebrow { display: flex; align-items: center; gap: 8px; margin: 0 0 14px; font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--ink); background: var(--brand); flex-shrink: 0; }
  h1 { font-family: var(--display); font-weight: 400; text-transform: uppercase; font-size: clamp(48px, 9vw, 104px); line-height: .88; letter-spacing: -.03em; margin: 0; }
  h1 .line { display: block; overflow: hidden; padding-bottom: .04em; }
  h1 .ch { display: inline-block; will-change: transform; }
  .strip { width: 160px; height: 14px; margin-top: 18px; border-radius: 999px; border: 3px solid var(--ink); background: var(--ramp); transform-origin: left center; }
  .lede { margin: 18px 0 0; max-width: 46ch; font-size: 18px; line-height: 1.55; color: var(--muted); }

  .bento { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: auto auto auto; gap: 14px; }
  .tile { position: relative; text-align: left; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; min-height: 108px; padding: 16px; background: var(--white); border: 3px solid var(--ink); border-radius: var(--r); box-shadow: var(--sh-card); transition: transform .15s, box-shadow .15s; }
  .tile:hover { transform: translate(-2px, -2px); box-shadow: var(--sh-lg); }
  .tile:active { transform: translate(2px, 2px); box-shadow: var(--sh-sm); }
  .tile .k { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  .tile .v { font-family: var(--display); font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
  .tile .s { font-size: 13px; color: var(--muted); }
  .tile.next { grid-column: 1 / -1; background: var(--brand); min-height: 128px; }
  .tile.next .s { color: var(--ink); font-weight: 600; }
  .tile.next .title { font-size: 22px; font-weight: 700; line-height: 1.2; }
  .tile .arrow { position: absolute; top: 14px; right: 14px; width: 30px; height: 30px; display: grid; place-items: center; border: 2px solid var(--ink); border-radius: 999px; background: var(--white); }

  /* ── Ticker ── */
  .ticker { background: var(--ink); color: var(--white); border-block: 3px solid var(--ink); overflow: hidden; white-space: nowrap; }
  .ticker-track { display: inline-flex; gap: 0; padding-block: 10px; will-change: transform; }
  .ticker-item { display: inline-flex; align-items: center; gap: 14px; padding-right: 28px; font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
  .ticker-item b { padding: 1px 8px; border-radius: 999px; background: var(--brand); color: var(--ink); }

  /* ── Sticky tab bar ── */
  .tabbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: var(--paper); border-bottom: 3px solid var(--ink); }
  .tabs { position: relative; display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding-block: 14px 16px; padding-right: 8px; }
  .tabs::-webkit-scrollbar { display: none; }
  .pill { position: absolute; top: 14px; left: 0; height: 50px; width: 0; border-radius: 999px; border: 3px solid var(--ink); background: var(--brand); box-shadow: var(--sh); pointer-events: none; z-index: 0; }
  .tab { position: relative; z-index: 1; flex-shrink: 0; display: inline-flex; align-items: center; gap: 8px; height: 50px; padding: 0 22px; border-radius: 999px; border: 3px solid var(--ink); background: var(--white); font-weight: 700; font-size: 15px; white-space: nowrap; transition: transform .15s; }
  .tab:hover { transform: translateY(-2px); }
  .tab[aria-selected="true"] { background: transparent; border-color: transparent; }
  .tab .count { min-width: 22px; height: 22px; padding: 0 6px; display: inline-grid; place-items: center; border-radius: 999px; background: var(--ink); color: var(--white); font-family: var(--mono); font-size: 11px; font-weight: 700; }
  .tab .count[hidden] { display: none !important; }

  /* ── Panel scaffolding ── */
  main.panel { padding-block: 32px 80px; }
  .head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; margin-bottom: 22px; }
  .head > div { min-width: 0; }
  h2 { margin: 0; font-size: clamp(28px, 4vw, 38px); font-weight: 700; letter-spacing: -.025em; line-height: 1.05; }
  .sub { margin: 8px 0 0; max-width: 56ch; color: var(--muted); font-size: 16px; }
  .label { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .sample { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; padding: 3px 10px; border: 2px dashed var(--ink); border-radius: 999px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border: 3px solid var(--ink); border-radius: var(--r); background: var(--ink); color: var(--white); font-weight: 700; font-size: 15px; box-shadow: var(--sh); transition: transform .12s, box-shadow .12s; text-decoration: none; }
  .btn:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 0 var(--ink); }
  .btn:active { transform: translate(2px, 2px); box-shadow: var(--sh-sm); }
  .btn.ghost { background: var(--white); color: var(--ink); }
  .btn.sm { min-height: 40px; padding: 0 14px; font-size: 14px; }
  .btn:disabled { opacity: .4; pointer-events: none; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 26px; }
  .chip { min-height: 38px; padding: 0 16px; border-radius: 999px; border: 2px solid var(--ink); background: var(--white); font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; transition: box-shadow .12s, transform .12s; }
  .chip:hover { box-shadow: var(--sh-sm); transform: translate(-1px, -1px); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--white); }

  .card { background: var(--white); border: 3px solid var(--ink); border-radius: var(--r); box-shadow: var(--sh-card); }
  .card.lift { transition: transform .15s, box-shadow .15s; }
  .card.lift:hover { transform: translate(-2px, -2px); box-shadow: var(--sh-lg); }
  .tag { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 999px; border: 2px solid var(--ink); font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; background: var(--white); color: var(--ink); white-space: nowrap; }
  .g0 { background: var(--brand); } .g1 { background: var(--orchid); } .g2 { background: var(--sky); } .g3 { background: var(--blush); }
  .avatar { flex-shrink: 0; width: 46px; height: 46px; display: grid; place-items: center; border: 2px solid var(--ink); border-radius: var(--r); font-weight: 700; font-size: 15px; color: var(--ink); }
  .avatar.lg { width: 58px; height: 58px; font-size: 17px; }
  .avatar.xs { width: 30px; height: 30px; font-size: 11px; border-radius: 8px; margin-left: -8px; box-shadow: 0 0 0 2px var(--white); }
  .avatar.xs:first-child { margin-left: 0; }
  .empty { padding: 44px 24px; text-align: center; background: var(--white); border: 3px dashed var(--ink); border-radius: var(--r); display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .empty p { margin: 0; }
  .empty .big { font-size: 20px; font-weight: 700; }
  .empty .small { color: var(--muted); }

  /* ── Events: ticket cards grouped by week ── */
  .weeks { display: flex; flex-direction: column; gap: 30px; }
  .week-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .week-head::after { content: ""; flex: 1; height: 3px; background: var(--ink); border-radius: 3px; }
  .week-head h3 { margin: 0; font-size: 18px; font-weight: 700; white-space: nowrap; }
  .week-note { margin: -4px 0 14px; font-size: 13px; color: var(--muted); }
  .tickets { display: grid; gap: 18px; }
  .ticket { display: grid; grid-template-columns: 92px minmax(0, 1fr) 190px; overflow: hidden; }
  .ticket .date { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 14px 8px; border-right: 3px solid var(--ink); }
  .ticket .date .mon { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .14em; }
  .ticket .date .day { font-family: var(--display); font-size: 38px; line-height: 1; }
  .ticket .date .dow { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .12em; }
  .ticket .body { min-width: 0; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
  .ticket .body h4 { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.25; }
  .ticket .body p { margin: 0; color: var(--muted); font-size: 14px; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 4px; font-size: 13px; font-weight: 500; }
  .meta span { display: inline-flex; align-items: center; gap: 6px; }
  .ticket .stub { position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; padding: 16px; border-left: 3px dashed var(--ink); background: var(--paper); }
  .ticket .stub::before, .ticket .stub::after { content: ""; position: absolute; left: -12px; width: 20px; height: 20px; border-radius: 50%; background: var(--paper); border: 3px solid var(--ink); }
  .ticket .stub::before { top: -12px; } .ticket .stub::after { bottom: -12px; }
  .stub .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .save[aria-pressed="true"] { background: var(--brand); color: var(--ink); }

  /* ── Study groups ── */
  .groups { display: grid; gap: 22px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
  .group { position: relative; display: flex; flex-direction: column; gap: 12px; padding: 20px; min-width: 0; }
  .group h3 { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.2; }
  .group p { margin: 0; color: var(--muted); font-size: 14px; }
  .group .row { display: flex; flex-wrap: wrap; gap: 6px; }
  .coord { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; color: var(--ink) !important; }
  .group .foot { margin-top: auto; padding-top: 14px; border-top: 3px solid var(--ink); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .stack { display: flex; align-items: center; }
  .members { display: flex; align-items: center; gap: 10px; }
  .members .n { font-family: var(--display); font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; }
  .sticker { position: absolute; top: -14px; right: 16px; transform: rotate(4deg); padding: 4px 10px; border: 3px solid var(--ink); border-radius: 8px; background: var(--brand); font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; box-shadow: var(--sh-sm); }
  @media (min-width: 760px) {
    .group.featured { grid-column: span 2; }
    .group.featured h3 { font-size: 26px; }
  }

  /* ── Connections ── */
  .conn { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 36px; align-items: start; }
  .deck { position: relative; padding-bottom: 18px; }
  .deck .ghost-card { position: absolute; inset: 0 0 18px; border: 3px solid var(--ink); border-radius: var(--r); background: var(--white); }
  .deck .ghost-card.l1 { transform: translate(8px, 9px) rotate(1.5deg); background: var(--soft); }
  .deck .ghost-card.l2 { transform: translate(16px, 18px) rotate(3deg); background: var(--paper); }
  .request { position: relative; z-index: 2; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  .request .who { display: flex; align-items: center; gap: 14px; }
  .request .name { margin: 0; font-size: 20px; font-weight: 700; }
  .request .note { margin: 0; padding: 10px 12px; border: 2px solid var(--ink); border-radius: 8px; background: var(--paper); font-size: 14px; }
  .request .acts { display: flex; gap: 10px; }
  .request .acts .btn { flex: 1; }
  .deck-count { margin-top: 10px; font-size: 13px; color: var(--muted); }
  .search { display: flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 12px; border: 3px solid var(--ink); border-radius: var(--r); background: var(--white); margin-bottom: 16px; }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 15px; }
  .people { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); }
  .person { display: flex; align-items: center; gap: 14px; padding: 16px; min-width: 0; }
  .person .meta2 { flex: 1; min-width: 0; }
  .person .nm { margin: 0; font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .person .mj { margin: 2px 0 0; font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ── Messaging ── */
  .dm { display: grid; grid-template-columns: 300px minmax(0, 1fr); overflow: hidden; height: 600px; }
  .inbox { border-right: 3px solid var(--ink); display: flex; flex-direction: column; min-width: 0; }
  .inbox-head, .chat-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 3px solid var(--ink); }
  .inbox-head h3 { margin: 0; font-size: 18px; }
  .convos { display: flex; flex-direction: column; gap: 4px; padding: 8px; overflow-y: auto; }
  .convo { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px; border: 2px solid transparent; border-radius: 8px; background: none; text-align: left; }
  .convo:hover { background: var(--paper); }
  .convo[aria-current="true"] { background: var(--soft); border-color: var(--ink); }
  .convo .info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .convo .top { display: flex; justify-content: space-between; gap: 8px; }
  .convo .nm { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .convo .tm { flex-shrink: 0; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .convo .pv { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .convo .pv.unread { color: var(--ink); font-weight: 700; }
  .badge { min-width: 22px; height: 22px; padding: 0 6px; display: grid; place-items: center; border-radius: 999px; border: 2px solid var(--ink); background: var(--brand); font-family: var(--mono); font-size: 11px; font-weight: 700; }
  .chat { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .chat-head { justify-content: flex-start; }
  .chat-head .who { min-width: 0; flex: 1; }
  .chat-head .who b { display: block; font-size: 16px; }
  .chat-head .who span { font-size: 13px; color: var(--muted); }
  .thread { flex: 1; min-height: 0; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; background: var(--paper); margin: 0; list-style: none; }
  .bubble { max-width: 78%; padding: 10px 14px; border: 2px solid var(--ink); border-radius: 16px; line-height: 1.45; box-shadow: var(--sh-sm); background: var(--white); align-self: flex-start; border-bottom-left-radius: 6px; overflow-wrap: anywhere; }
  .bubble.mine { align-self: flex-end; background: var(--ink); color: var(--white); border-bottom-left-radius: 16px; border-bottom-right-radius: 6px; }
  .bubble .t { display: block; margin-top: 4px; font-family: var(--mono); font-size: 10px; opacity: .65; }
  .typing { align-self: flex-start; display: inline-flex; gap: 5px; padding: 12px 14px; border: 2px solid var(--ink); border-radius: 16px; border-bottom-left-radius: 6px; background: var(--white); box-shadow: var(--sh-sm); }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink); display: block; }
  .quick { display: flex; gap: 8px; padding: 10px 12px 0; overflow-x: auto; scrollbar-width: none; }
  .quick::-webkit-scrollbar { display: none; }
  .quick .chip { flex-shrink: 0; min-height: 32px; font-size: 11px; }
  .composer { display: flex; gap: 10px; padding: 12px; }
  .composer input { flex: 1; min-width: 0; min-height: 46px; padding: 0 14px; border: 3px solid var(--ink); border-radius: var(--r); background: var(--white); font-size: 15px; outline: 0; }
  .composer input:focus { box-shadow: var(--sh-sm); }

  /* ── Modal + toast ── */
  .backdrop { position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: rgba(10, 10, 10, .45); }
  .modal { width: 100%; max-width: 540px; max-height: 100%; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 14px; background: var(--white); border: 3px solid var(--ink); border-radius: 12px; box-shadow: 9px 9px 0 0 var(--ink); }
  .modal-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .modal h2 { font-family: var(--display); font-weight: 400; text-transform: uppercase; font-size: 26px; line-height: 1; }
  .x { width: 42px; height: 42px; display: grid; place-items: center; border: 3px solid var(--ink); border-radius: var(--r); background: var(--white); box-shadow: var(--sh-sm); }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field input, .field select, .field textarea { min-height: 46px; padding: 10px 12px; border: 3px solid var(--ink); border-radius: var(--r); background: var(--white); font-size: 15px; outline: 0; }
  .field textarea { resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus { box-shadow: var(--sh-sm); }
  .seg { display: flex; flex-wrap: wrap; gap: 8px; }
  .seg .chip { flex: 1 1 100px; }
  .modal-acts { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; padding-top: 4px; }
  .toast { position: fixed; z-index: 90; left: 0; right: 0; margin-inline: auto; width: fit-content; bottom: max(20px, calc(env(safe-area-inset-bottom, 0px) + 12px)); max-width: calc(100% - 32px); padding: 12px 16px; border: 3px solid var(--ink); border-radius: var(--r); background: var(--ink); color: var(--white); font-weight: 600; box-shadow: 5px 5px 0 0 #fb923c; }

  /* ── Small screens ── */
  @media (max-width: 900px) {
    .hero .wrap { grid-template-columns: minmax(0, 1fr); align-items: start; }
    .conn { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 760px) {
    .crumb { display: none; }
    .ticket { grid-template-columns: 74px minmax(0, 1fr); }

    h += '<div class="chat"><div class="chat-head">' + avatar(state.active) + '<div class="who"><b>' + a.name + "</b><span>" + a.major + " · " + a.year + '</span></div></div><ol class="thread" id="thread">' +
      (state.messages[state.active] || []).map(function (m) { return bubble(m); }).join("") + "</ol>" +
      '<div class="quick" aria-label="Quick replies">' + ["Sounds good!", "What time works?", "I'm in", "Can you share the notes?"].map(function (q) { return '<button class="chip" data-action="quick" data-value="' + esc(q) + '">' + q + "</button>"; }).join("") + "</div>" +
      '<form class="composer" id="composer"><label for="draft" style="position:absolute;left:-9999px">Message ' + a.name + '</label><input id="draft" autocomplete="off" placeholder="Message ' + a.name.split(" ")[0] + '…" value="' + esc(state.draft) + '"><button class="btn" type="submit">Send</button></form></div></div>';
    return h;
  }

  function bubble(m) {
    return '<li class="bubble' + (m.from === "me" ? " mine" : "") + '">' + esc(m.text) + '<span class="t">' + m.time + "</span></li>";
  }

  var VIEWS = { "events": eventsView, "study-groups": groupsView, "connections": connectionsView, "messaging": messagingView };

  // ===== RENDERING + MOTION =====
  var panel = $("#panel");

  function renderPanel() {
    panel.innerHTML = VIEWS[state.tab]();
    var t = $("#thread"); if (t) t.scrollTop = t.scrollHeight;
  }

  function animateIn() {
    if (!animate) return;
    var items = $$("[data-in]", panel);
    G.fromTo(items, { y: 34, autoAlpha: 0, rotation: function (i) { return i % 2 ? 1.2 : -1.2; } },
      { y: 0, autoAlpha: 1, rotation: 0, duration: 0.6, ease: "back.out(1.5)", stagger: 0.055, clearProps: "transform,opacity,visibility" });
  }

  function movePill(instant) {
    var btn = $('.tab[data-tab="' + state.tab + '"]'), pill = $("#pill");
    if (!btn) return;
    var x = btn.offsetLeft, w = btn.offsetWidth;
    if (animate && !instant) G.to(pill, { x: x, width: w, duration: 0.55, ease: "back.out(1.7)" });
    else if (G) G.set(pill, { x: x, width: w });
    else { pill.style.transform = "translateX(" + x + "px)"; pill.style.width = w + "px"; }
    $$(".tab").forEach(function (b) { b.setAttribute("aria-selected", b.dataset.tab === state.tab ? "true" : "false"); });
    var tabs = $("#tabs");
    if (tabs.scrollWidth > tabs.clientWidth) tabs.scrollTo({ left: Math.max(0, x - 24), behavior: animate ? "smooth" : "auto" });
  }

  function setTab(tab, opts) {
    if (!VIEWS[tab]) tab = "events";
    opts = opts || {};
    var changed = tab !== state.tab;
    state.tab = tab;
    if (tab === "messaging") { state.unread[state.active] = 0; updateCounts(); }
    movePill(opts.instant);
    if (location.hash.slice(1) !== tab) { try { history.replaceState(null, "", "#" + tab); } catch (e) { location.hash = tab; } }
    if (!changed && !opts.force) return;
    if (opts.scroll) {
      var bar = $(".tabbar"); var top = bar.getBoundingClientRect().top + window.scrollY - 2;
      if (window.scrollY > top || opts.scroll === "always") window.scrollTo({ top: top, behavior: animate ? "smooth" : "auto" });
    }
    if (animate && !opts.instant) {
      G.to(panel, { autoAlpha: 0, y: 10, duration: 0.16, ease: "power2.in", onComplete: function () {
        renderPanel(); G.set(panel, { autoAlpha: 1, y: 0 }); animateIn();
      } });
    } else { renderPanel(); animateIn(); }
  }

  // Count-up numbers in the bento + tab badges
  var shown = {};
  function updateCounts() {
    var values = { requests: state.requests.length, unread: unreadTotal(), groups: joinedCount(), saved: savedCount() };
    Object.keys(values).forEach(function (k) {
      var v = values[k];
      $$('[data-count="' + k + '"]').forEach(function (el) {
        if (el.classList.contains("count")) { el.textContent = v; el.hidden = v === 0; return; }
        var from = shown[k] == null ? v : shown[k];
        if (animate && from !== v) {
          var o = { n: from };
          G.to(o, { n: v, duration: 0.6, ease: "power2.out", onUpdate: function () { el.textContent = Math.round(o.n); } });
          G.fromTo(el.closest(".tile"), { rotation: -2 }, { rotation: 0, duration: 0.5, ease: "elastic.out(1, 0.4)", clearProps: "transform" });
        } else el.textContent = v;
      });
      shown[k] = v;
    });
  }

  function pop(el) {
    if (!animate || !el) return;
    G.fromTo(el, { scale: 0.86 }, { scale: 1, duration: 0.5, ease: "elastic.out(1.1, 0.45)", clearProps: "transform" });
  }

  var toastTimer = null;
  function toast(msg) {
    var t = $("#toast");
    t.textContent = msg; t.hidden = false;
    if (animate) G.fromTo(t, { y: 40, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.45, ease: "back.out(2)" });
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      if (animate) G.to(t, { y: 30, autoAlpha: 0, duration: 0.25, onComplete: function () { t.hidden = true; } });
      else t.hidden = true;
    }, 2200);
  }

  // ===== MODAL =====
  function openModal() {
    state.modalOpen = true;
    if (state.courseFilter !== "All") state.form.course = state.courseFilter;
    var f = state.form;
    $("#modal-root").innerHTML = '<div class="backdrop" id="backdrop"><form class="modal" id="group-form" role="dialog" aria-modal="true" aria-labelledby="modal-title">' +
      '<div class="modal-top"><h2 id="modal-title">New study group</h2><button type="button" class="x" data-action="close-modal" aria-label="Close">' + ICON.x + "</button></div>" +
      '<label class="field" for="f-course"><span class="label">Course</span><select id="f-course">' + COURSES.map(function (c) { return "<option" + (c === f.course ? " selected" : "") + ">" + c + "</option>"; }).join("") + "</select></label>" +
      '<label class="field" for="f-topic"><span class="label">Topic</span><input id="f-topic" required placeholder="Exam 2 prep, lab help, weekly problem sets…" value="' + esc(f.topic) + '"></label>' +
      '<div class="field"><span class="label">Meeting preference</span><div class="seg" role="group" aria-label="Meeting preference">' + [["async", "Async"], ["in-person", "In person"], ["both", "Both"]].map(function (p) { return '<button type="button" class="chip" data-action="pref" data-value="' + p[0] + '" aria-pressed="' + (f.pref === p[0]) + '">' + p[1] + "</button>"; }).join("") + "</div></div>" +
      '<label class="field" for="f-coord"><span class="label">How you\'ll coordinate</span><input id="f-coord" placeholder="Discord server, GroupMe, group chat…" value="' + esc(f.coord) + '"></label>' +
      '<label class="field" for="f-desc"><span class="label">Description</span><textarea id="f-desc" rows="3" placeholder="What you\'ll work on and who it\'s for">' + esc(f.desc) + "</textarea></label>" +
      '<div class="modal-acts"><button type="button" class="btn ghost" data-action="close-modal">Cancel</button><button type="submit" class="btn">Create group</button></div></form></div>';
    if (animate) {
      G.fromTo("#backdrop", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2 });
      G.fromTo(".modal", { y: 40, scale: 0.92, rotation: -2 }, { y: 0, scale: 1, rotation: 0, duration: 0.5, ease: "back.out(1.6)" });
    }
    setTimeout(function () { var t = $("#f-topic"); if (t) t.focus(); }, 60);
  }
  function closeModal() {
    if (!state.modalOpen) return;
    state.modalOpen = false;
    var done = function () { $("#modal-root").innerHTML = ""; };
    if (animate) { G.to(".modal", { y: 30, scale: 0.95, duration: 0.18, ease: "power2.in" }); G.to("#backdrop", { autoAlpha: 0, duration: 0.2, onComplete: done }); }
    else done();
  }
  function readForm() {
    state.form.course = $("#f-course").value;
    state.form.topic = $("#f-topic").value;
    state.form.coord = $("#f-coord").value;
    state.form.desc = $("#f-desc").value;
  }

  // ===== ACTIONS =====
  function joinGroup(id, btn) {
    state.joined[id] = !state.joined[id];
    var g = state.groups.find(function (x) { return x.id === id; });
    var wasJoin = state.joined[id];
    renderPanel(); updateCounts();
    var card = $('[data-group="' + id + '"]');
    pop($("[data-n]", card));
    if (wasJoin && animate) G.from($("[data-me]", card), { scale: 0, rotation: -90, duration: 0.5, ease: "back.out(2.5)" });
    toast(wasJoin ? "Joined " + g.course + " · " + g.topic : "Left " + g.course + " group");
  }

  function decideRequest(accept) {
    var card = $("#request-card"); if (!card) return;
    var req = state.requests[0];
    var finish = function () {
      state.requests.shift();
      if (accept && state.connections.indexOf(req.uid) === -1) state.connections.unshift(req.uid);
      state.search = "";
      renderPanel(); updateCounts();
      if (accept) {
        var el = $('[data-person="' + req.uid + '"]');
        if (animate && el) G.fromTo(el, { scale: 0.4, autoAlpha: 0, rotation: -6 }, { scale: 1, autoAlpha: 1, rotation: 0, duration: 0.65, ease: "back.out(2)", clearProps: "transform,opacity,visibility" });
        if (el) { el.style.background = "var(--brand)"; setTimeout(function () { el.style.transition = "background .8s"; el.style.background = ""; }, 900); }
      }
      var next = $("#request-card");
      if (animate && next) G.from(next, { y: 18, scale: 0.97, duration: 0.4, ease: "back.out(1.6)" });
      toast(accept ? PEOPLE[req.uid].name + " is now a connection" : "Request declined");
    };
    if (animate) G.to(card, { x: accept ? 220 : -220, y: -24, rotation: accept ? 12 : -12, autoAlpha: 0, duration: 0.45, ease: "power2.in", onComplete: finish });
    else finish();
  }

  function openChat(uid) {
    if (state.convoOrder.indexOf(uid) === -1) { state.convoOrder.unshift(uid); state.messages[uid] = state.messages[uid] || []; }
    state.active = uid; state.unread[uid] = 0;
    setTab("messaging", { force: true, scroll: true });
    updateCounts();
  }

  function sendMessage(text) {
    text = String(text || "").trim();
    if (!text) return;
    var uid = state.active;
    state.messages[uid].push({ from: "me", text: text, time: nowTime() });
    state.convoOrder = [uid].concat(state.convoOrder.filter(function (u) { return u !== uid; }));
    state.draft = "";
    renderPanel();
    var thread = $("#thread"), last = thread.lastElementChild;
    if (animate) G.from(last, { y: 20, scale: 0.85, autoAlpha: 0, transformOrigin: "100% 100%", duration: 0.45, ease: "back.out(2)" });
    var input = $("#draft"); if (input) input.focus();
    // Fake reply so the thread feels alive (real version: onSnapshot on /conversations/{id}/messages)
    var typing = document.createElement("li");
    typing.className = "typing"; typing.setAttribute("aria-label", PEOPLE[uid].name + " is typing");
    typing.innerHTML = "<i></i><i></i><i></i>";
    setTimeout(function () {
      if (state.tab !== "messaging" || state.active !== uid) return;
      var th = $("#thread"); if (!th) return;
      th.appendChild(typing); th.scrollTop = th.scrollHeight;
      if (animate) G.to($$("i", typing), { y: -5, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: -1, stagger: 0.12 });
    }, 450);
    setTimeout(function () {
      if (G) G.killTweensOf($$("i", typing));
      var pool = REPLIES[uid] || ["Sounds good!"];
      var i = state.replyIndex[uid] || 0;
      state.messages[uid].push({ from: uid, text: pool[i % pool.length], time: nowTime() });
      state.replyIndex[uid] = i + 1;
      if (state.tab !== "messaging") { state.unread[uid] = (state.unread[uid] || 0) + 1; updateCounts(); return; }
      if (state.active !== uid) { state.unread[uid] = (state.unread[uid] || 0) + 1; updateCounts(); renderPanel(); return; }
      var keep = $("#draft") ? $("#draft").value : "";
      state.draft = keep;
      renderPanel();
      var th = $("#thread"), lst = th.lastElementChild;
      if (animate) G.from(lst, { y: 20, scale: 0.85, autoAlpha: 0, transformOrigin: "0% 100%", duration: 0.45, ease: "back.out(2)" });
      var d = $("#draft"); if (d && document.activeElement === document.body) d.focus();
    }, 1700);
  }

  document.addEventListener("click", function (e) {
    var go = e.target.closest("[data-go]");
    if (go) { setTab(go.dataset.go, { scroll: "always" }); return; }
    var tab = e.target.closest(".tab");
    if (tab) { setTab(tab.dataset.tab); return; }
    if (e.target.id === "backdrop") { closeModal(); return; }
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var a = el.dataset.action, v = el.dataset.value;
    if (a === "event-filter") { state.eventFilter = v; renderPanel(); animateIn(); }
    else if (a === "course-filter") { state.courseFilter = v; renderPanel(); animateIn(); }
    else if (a === "save") {
      state.saved[v] = !state.saved[v]; renderPanel(); updateCounts();
      pop($('[data-event="' + v + '"] .save'));
      var ev = EVENTS.find(function (x) { return x.id === v; });
      toast(state.saved[v] ? "Saved " + ev.title + " to your week" : "Removed from your week");
    }
    else if (a === "join") joinGroup(v, el);
    else if (a === "open-modal") openModal();
    else if (a === "close-modal") closeModal();
    else if (a === "pref") { readForm(); state.form.pref = v; $$('[data-action="pref"]').forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.value === v); }); pop(el); }
    else if (a === "accept") decideRequest(true);
    else if (a === "decline") decideRequest(false);
    else if (a === "message") openChat(v);
    else if (a === "open-convo") {
      state.draft = $("#draft") ? $("#draft").value : state.draft;
      state.active = v; state.unread[v] = 0; renderPanel(); updateCounts();
      if (animate) G.from($$("#thread .bubble"), { y: 14, autoAlpha: 0, duration: 0.35, stagger: 0.04, ease: "power2.out" });
    }
    else if (a === "quick") sendMessage(v);
    else if (a === "goto") setTab(v);
  });

  document.addEventListener("submit", function (e) {
    e.preventDefault();
    if (e.target.id === "composer") { sendMessage($("#draft").value); return; }
    if (e.target.id === "group-form") {
      readForm();
      var f = state.form;
      if (!f.topic.trim()) { pop($("#f-topic")); $("#f-topic").focus(); return; }
      var id = "new" + Date.now();
      state.groups.unshift({ id: id, course: f.course, topic: f.topic.trim(), desc: f.desc.trim() || "New group. Say hi and share what you're working on.", members: [], pref: f.pref, coord: f.coord.trim() || "Coordination details coming soon" });
      state.joined[id] = true;
      state.courseFilter = "All";
      state.form = { course: f.course, topic: "", pref: "both", coord: "", desc: "" };
      closeModal(); renderPanel(); updateCounts();
      var card = $('[data-group="' + id + '"]');
      if (animate && card) G.fromTo(card, { scale: 0.6, rotation: -4, autoAlpha: 0 }, { scale: 1, rotation: 0, autoAlpha: 1, duration: 0.7, ease: "back.out(1.8)", clearProps: "transform,opacity,visibility" });
      toast("Created your " + f.course + " group");
    }
  });

  document.addEventListener("input", function (e) {
    if (e.target.id === "people-search") {
      state.search = e.target.value;
      var pos = e.target.selectionStart;
      renderPanel();
      var s = $("#people-search"); s.focus(); try { s.setSelectionRange(pos, pos); } catch (er) {}
    }
    if (e.target.id === "draft") state.draft = e.target.value;
  });

  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && state.modalOpen) closeModal(); });
  window.addEventListener("hashchange", function () { var h = location.hash.slice(1); if (VIEWS[h] && h !== state.tab) setTab(h, { scroll: true }); });
  window.addEventListener("resize", function () { movePill(true); });

  // ===== TICKER =====
  var tickerText = EVENTS.map(function (e) { return '<span class="ticker-item"><b>' + e.mon + " " + e.day + "</b>" + e.title + "</span>"; }).join("");
  $("#ticker").innerHTML = tickerText + tickerText;

  // ===== BOOT =====
  // Split the title into letters for the intro
  $$("#title .line").forEach(function (line) {
    line.innerHTML = line.textContent.split("").map(function (c) { return '<span class="ch">' + c + "</span>"; }).join("");
  });
  var start = location.hash.slice(1);
  state.tab = VIEWS[start] ? start : "events";
  renderPanel();
  updateCounts();
  movePill(true);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { movePill(true); });

  if (animate) {
    var tl = G.timeline({ defaults: { ease: "power3.out" } });
    tl.from("#title .ch", { yPercent: 110, rotation: 8, duration: 0.7, stagger: 0.035 })
      .from("#strip", { scaleX: 0, duration: 0.6, ease: "expo.out" }, "-=0.35")
      .from(".hero .eyebrow, #lede", { y: 16, autoAlpha: 0, duration: 0.5, stagger: 0.08 }, "-=0.45")
      .from(".tile", { y: 50, rotation: function (i) { return i % 2 ? 3 : -3; }, autoAlpha: 0, duration: 0.7, ease: "back.out(1.5)", stagger: 0.07, clearProps: "transform,opacity,visibility" }, "-=0.55")
      .from(".tab", { y: 18, autoAlpha: 0, duration: 0.45, stagger: 0.05, clearProps: "transform,opacity,visibility" }, "-=0.45")
      .from("#pill", { scaleX: 0, duration: 0.5, ease: "back.out(2)" }, "-=0.2")
      .add(function () { animateIn(); }, "-=0.35");
    G.to("#ticker", { xPercent: -50, duration: 38, ease: "none", repeat: -1 });
    // Bento numbers count up on load
    $$(".tile .v").forEach(function (el) {
      var target = +el.textContent, o = { n: 0 };
      G.to(o, { n: target, duration: 1.1, delay: 0.7, ease: "power2.out", onUpdate: function () { el.textContent = Math.round(o.n); } });
    });
  }
})();
</script>

</body>
</html>
